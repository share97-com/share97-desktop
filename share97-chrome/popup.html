<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Share97</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #11131a; --muted: #6b7280; --line: #e5e7eb; --brand: #7c5cff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0b10; --fg: #e5e7eb; --muted: #9ca3af; --line: #23263a; } }
      body { margin: 0; width: 300px; padding: 16px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      h1 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
      h1 img { width: 20px; height: 20px; border-radius: 4px; }
      .status { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
      .dot.connected { background: #10b981; } .dot.pending { background: #f59e0b; } .dot.rejected { background: #ef4444; }
      p { margin: 8px 0 0; color: var(--muted); }
      label { display: block; margin-top: 14px; font-weight: 600; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
      button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      #retry { margin-top: 10px; width: 100%; }
    </style>
  </head>
  <body>
    <h1><img src="icon.png" alt="" /> Share97</h1>
    <div class="status"><span id="dot" class="dot"></span><strong id="title"></strong></div>
    <p id="help"></p>
    <button id="retry" hidden></button>
    <label for="name" id="nameLabel"></label>
    <div class="row">
      <input id="name" maxlength="60" />
      <button id="save" class="primary"></button>
    </div>
    <p id="nameHelp"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
